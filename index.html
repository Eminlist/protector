<!DOCTYPE html>
<html lang="az" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Qoruyucu şüşə uyğunluğu</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Eminlist/protector/main/11.png">

    <style>
        :root[data-theme="dark"] {
            --bg: #0a0a0a; --surface: #111111; --surface-2: #1a1a1a;
            --border: #333333; --text: #f5f5f5; --muted: #999999;
            --accent-color: #d4af37; --accent-dark: #8a6d1d;
            --header-bg: rgba(10, 10, 10, 0.9); --card-bg: rgba(20, 20, 20, 0.7);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { width: 100%; min-height: 100%; background: var(--bg); color: var(--text); }
        .top-header { height: 110px; padding: 22px 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--accent-color); background: var(--header-bg); }
        .header-title { font-size: 24px; font-weight: 800; color: var(--text); }
        .main-content { padding: 24px; }
        .search-wrapper { width: 100%; height: 72px; border: 2px solid var(--accent-color); display: flex; align-items: center; background: var(--surface); margin-bottom: 16px; border-radius: 20px; overflow: hidden; position: relative; }
        .search-input { flex: 1; height: 100%; border: none; outline: none; background: transparent; color: var(--text); font-size: 20px; padding: 0 22px; }
        .menu-btn-group { display: flex; gap: 10px; }
        .btn-custom { width: 50px; height: 50px; border: 2px solid var(--accent-color); background: transparent; color: var(--accent-color); font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 16px; }
        
        /* Modallar */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-box { width: 100%; max-width: 400px; background: var(--surface); border: 2px solid var(--accent-color); border-radius: 20px; padding: 24px; text-align: center; }
        .modal-box input, .modal-box textarea { width: 100%; padding: 12px; margin: 8px 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); outline: none; }
        .modal-box button { width: 100%; padding: 12px; background: var(--accent-color); color: #111; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .close-link { color: var(--accent-color); font-size: 13px; cursor: pointer; display: block; margin-top: 12px; }
        
        #install-banner { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(150%); background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 12px 18px; display: flex; align-items: center; gap: 15px; z-index: 1150; transition: transform 0.4s ease; }
        #install-banner.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>

<body>

<!-- QEYDİYYAT / GİRİŞ MODALI -->
<div id="auth-modal" class="modal">
    <div class="modal-box">
        <div id="registerFormContainer">
            <h3 style="color:var(--accent-color); margin-bottom:12px;">Mağaza Qeydiyyatı</h3>
            <p style="font-size:12px; color:var(--muted); margin-bottom:10px;">Limit bitdi. Davam etmək üçün daxil olun.</p>
            <input type="text" id="regUser" placeholder="Ləqəb *" required>
            <input type="email" id="regEmail" placeholder="E-poçt *">
            <input type="password" id="regPass" placeholder="Parol *">
            <input type="text" id="regStore" placeholder="Mağaza adı">
            <input type="text" id="regAddress" placeholder="Mağaza ünvanı">
            <input type="tel" id="regPhone" value="+994" placeholder="Telefon">
            <button onclick="registerUser()">Qeydiyyatı Tamamla</button>
            <span class="close-link" onclick="switchAuthMode('login')">Artıq hesabınız var? Giriş et</span>
        </div>
        <div id="loginFormContainer" style="display: none;">
            <h3 style="color:var(--accent-color); margin-bottom:12px;">Giriş Et</h3>
            <input type="email" id="logEmail" placeholder="E-poçt">
            <input type="password" id="logPass" placeholder="Parol">
            <button onclick="loginUser()">Daxil Ol</button>
            <span class="close-link" onclick="switchAuthMode('register')">Hesabın yoxdur? Qeydiyyat</span>
        </div>
        <div id="authMsg" style="color:#e74c3c; font-size:12px; margin-top:8px;"></div>
    </div>
</div>

<!-- PROFİL MODALI -->
<div id="profile-modal" class="modal">
    <div class="modal-box">
        <h3 style="color:var(--accent-color); margin-bottom:15px;">Mağaza Profili</h3>
        <input type="text" id="profUser" placeholder="Ləqəb">
        <input type="text" id="profStore" placeholder="Mağaza adı">
        <input type="text" id="profAddress" placeholder="Mağaza ünvanı">
        <input type="tel" id="profPhone" placeholder="Telefon">
        <button onclick="updateProfile()">Yadda Saxla</button>
        <button onclick="logoutUser()" style="background:#e74c3c; color:#fff;">Hesabdan Çıxış Et</button>
        <span class="close-link" onclick="closeProfile()">Bağla</span>
        <div id="profMsg" style="font-size:12px; margin-top:8px;"></div>
    </div>
</div>

<!-- ADMIN PANEL MODALI -->
<div id="admin-modal" class="modal">
    <div class="modal-box" style="max-width: 450px;">
        <h3 style="color:var(--accent-color); margin-bottom:10px;">Admin Panel</h3>
        <p style="font-size:12px; color:var(--muted); margin-bottom:10px;">Vergüllə ayıraraq modelləri yazın:</p>
        <textarea id="adminNewModels" rows="4" placeholder="Model 1, Model 2"></textarea>
        <button onclick="addNewModelGroup()">Bazaya Əlavə Et</button>
        <button onclick="closeAdminPanel()" style="background:#e74c3c; color:#fff;">Bağla</button>
        <div id="adminMsg" style="font-size:12px; margin-top:8px;"></div>
    </div>
</div>

<div id="app">
    <header class="top-header">
        <div>
            <div style="font-size:12px; color:var(--accent-color); letter-spacing:3px;">ANTİUDAR</div>
            <div class="header-title">Qoruyucu şüşə uyğunluğu</div>
        </div>
        <div class="menu-btn-group">
            <button class="btn-custom" id="adminBtn" onclick="openAdminPanel()" style="display:none;" title="Admin Panel">⚙️</button>
            <button class="btn-custom" onclick="openProfile()" title="Profil">👤</button>
        </div>
    </header>

    <main class="main-content">
        <div class="search-wrapper">
            <input id="searchInput" class="search-input" type="text" placeholder="Model axtar..." autocomplete="off">
        </div>
        <div id="status" style="color:var(--accent-color); font-size:14px; margin-bottom:10px; text-transform:uppercase;"></div>
        <div id="results"></div>
    </main>
</div>

<!-- PWA BANNER (48 SAAT QAYDASI) -->
<div id="install-banner">
    <div><strong>ProTechtor</strong><br><span style="font-size:12px; color:#aaa;">Tətbiqi quraşdırın</span></div>
    <button onclick="installPWA()" style="background:var(--accent-color); border:none; padding:8px 12px; border-radius:8px; font-weight:700; cursor:pointer;">Quraşdır</button>
    <button onclick="dismissInstall()" style="background:none; border:none; color:#aaa; font-size:18px; cursor:pointer;">×</button>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyB-kuPK97aaUbXNf1vJqUf7aFAKEJVvY8o",
    authDomain: "protechtor-99407.firebaseapp.com",
    projectId: "protechtor-99407",
    storageBucket: "protechtor-99407.firebasestorage.app",
    messagingSenderId: "703242369784",
    appId: "1:703242369784:web:03bc54204f753af9cb990d"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAIL = "o553115544@gmail.com";
let database = [];
let searchCount = parseInt(localStorage.getItem("search_count") || "0");
let soundEnabled = localStorage.getItem("antiudar_sound") !== "false";
let deferredPrompt = null;

document.addEventListener("DOMContentLoaded", function () {
    loadDatabaseFromFirebase();

    auth.onAuthStateChanged((user) => {
        if (user) {
            if (user.email === ADMIN_EMAIL) {
                document.getElementById("adminBtn").style.display = "flex";
            }
        } else {
            if (searchCount >= 3) {
                document.getElementById("auth-modal").style.display = "flex";
            }
        }
    });

    document.getElementById("searchInput").addEventListener("input", function(e) {
        if (!auth.currentUser) {
            searchCount++;
            localStorage.setItem("search_count", searchCount);
            if (searchCount > 3) {
                document.getElementById("auth-modal").style.display = "flex";
                return;
            }
        }
        playSoundEffect();
        performSearch(e.target.value);
    });

    // PWA 48 Saat yoxlaması
    window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        let dismissed = localStorage.getItem("install_dismiss");
        let FORTY_EIGHT_HOURS = 48 * 60 * 60 * 1000;
        if (!dismissed || Date.now() - parseInt(dismissed) > FORTY_EIGHT_HOURS) {
            setTimeout(() => document.getElementById("install-banner").classList.add("show"), 1500);
        }
    });
});

function playSoundEffect() {
    if (!soundEnabled) return;
    try {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        let gain = ctx.createGain();
        osc.frequency.setValueAtTime(580, ctx.currentTime);
        gain.gain.setValueAtTime(0.05, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.1);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.1);
    } catch(e) {}
}

function loadDatabaseFromFirebase() {
    db.collection("protector_db").get().then((querySnapshot) => {
        database = [];
        querySnapshot.forEach((doc) => {
            database.push(doc.data().models);
        });
    });
}

function addNewModelGroup() {
    let text = document.getElementById("adminNewModels").value.trim();
    if (!text) return;
    let modelsArray = text.split(",").map(m => m.trim()).filter(m => m.length > 0);

    db.collection("protector_db").add({ models: modelsArray }).then(() => {
        document.getElementById("adminMsg").style.color = "green";
        document.getElementById("adminMsg").innerText = "Uğurla əlavə edildi!";
        document.getElementById("adminNewModels").value = "";
        loadDatabaseFromFirebase();
    }).catch(err => {
        document.getElementById("adminMsg").style.color = "red";
        document.getElementById("adminMsg").innerText = "Xəta: " + err.message;
    });
}

function performSearch(query) {
    let resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";
    query = query.toLowerCase().trim();
    if (!query) return;

    let foundMatches = [];
    database.forEach(group => {
        if (group.some(m => m.toLowerCase().includes(query))) {
            foundMatches.push(group);
        }
    });

    document.getElementById("status").innerText = foundMatches.length + " nəticə tapıldı";
    foundMatches.forEach(group => {
        let div = document.createElement("div");
        div.style.cssText = "padding:15px; background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:8px;";
        div.innerHTML = "<b>Uyğun modellər:</b> " + group.join(" ↔ ");
        resultsDiv.appendChild(div);
    });
}

function switchAuthMode(mode) {
    document.getElementById("registerFormContainer").style.display = mode === "register" ? "block" : "none";
    document.getElementById("loginFormContainer").style.display = mode === "login" ? "block" : "none";
}

function registerUser() {
    let user = document.getElementById("regUser").value.trim();
    let email = document.getElementById("regEmail").value.trim();
    let pass = document.getElementById("regPass").value.trim();
    let store = document.getElementById("regStore").value.trim();
    let address = document.getElementById("regAddress").value.trim();
    let phone = document.getElementById("regPhone").value.trim();

    if(!user || !email || !pass) { document.getElementById("authMsg").innerText = "Ləqəb, e-poçt və parol doldurulmalıdır!"; return; }

    auth.createUserWithEmailAndPassword(email, pass).then((res) => {
        db.collection("users").doc(res.user.uid).set({ username: user, email, storeName: store, storeAddress: address, phoneNumber: phone });
        localStorage.setItem("search_count", "0");
        document.getElementById("auth-modal").style.display = "none";
    }).catch(err => document.getElementById("auth-modal").style.display = "none", alert(err.message));
}

function loginUser() {
    let email = document.getElementById("logEmail").value.trim();
    let pass = document.getElementById("logPass").value.trim();
    auth.signInWithEmailAndPassword(email, pass).then(() => {
        localStorage.setItem("search_count", "0");
        document.getElementById("auth-modal").style.display = "none";
        location.reload();
    }).catch(() => document.getElementById("authMsg").innerText = "E-poçt və ya parol səhvdir!");
}

function openProfile() {
    let user = auth.currentUser;
    if(!user) { document.getElementById("auth-modal").style.display = "flex"; return; }
    db.collection("users").doc(user.uid).get().then((doc) => {
        if(doc.exists) {
            let data = doc.data();
            document.getElementById("profUser").value = data.username || "";
            document.getElementById("profStore").value = data.storeName || "";
            document.getElementById("profAddress").value = data.storeAddress || "";
            document.getElementById("profPhone").value = data.phoneNumber || "+994";
        }
        document.getElementById("profile-modal").style.display = "flex";
    });
}
function closeProfile() { document.getElementById("profile-modal").style.display = "none"; }

function updateProfile() {
    let user = auth.currentUser;
    if(!user) return;
    db.collection("users").doc(user.uid).update({
        username: document.getElementById("profUser").value.trim(),
        storeName: document.getElementById("profStore").value.trim(),
        storeAddress: document.getElementById("profAddress").value.trim(),
        phoneNumber: document.getElementById("profPhone").value.trim()
    }).then(() => {
        document.getElementById("profMsg").style.color = "green";
        document.getElementById("profMsg").innerText = "Yeniləndi!";
        setTimeout(() => closeProfile(), 1500);
    });
}

function logoutUser() {
    auth.signOut().then(() => { localStorage.removeItem("search_count"); location.reload(); });
}

function openAdminPanel() { document.getElementById("admin-modal").style.display = "flex"; }
function closeAdminPanel() { document.getElementById("admin-modal").style.display = "none"; }

function installPWA() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; document.getElementById("install-banner").classList.remove("show"); });
}
function dismissInstall() {
    localStorage.setItem("install_dismiss", Date.now().toString());
    document.getElementById("install-banner").classList.remove("show");
}
</script>
</body>
</html>
