<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ProTector</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#009688">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ProTector">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/644/644458.png">

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 16px; background-color: #121212; color: #ffffff; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { margin: 0 0 6px 0; font-size: 22px; color: #009688; }
    
    .search-box { width: 100%; position: sticky; top: 10px; z-index: 10; background: #121212; padding-bottom: 10px; }
    input {
      width: 100%; padding: 14px 16px; font-size: 16px; border-radius: 12px;
      border: 1px solid #333; background: #1e1e1e; color: #fff; outline: none;
    }
    input:focus { border-color: #009688; }
    
    /* Brend filtrləri üçün dizayn */
    .filters {
      display: flex; gap: 10px; margin-top: 10px;
      overflow-x: auto; padding-bottom: 5px;
      -ms-overflow-style: none; scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 8px 16px; border-radius: 20px; border: 1px solid #333;
      background: #1e1e1e; color: #fff; font-size: 14px;
      white-space: nowrap; cursor: pointer; transition: 0.2s;
    }
    .filter-btn.active { background: #009688; border-color: #009688; font-weight: bold; }

    .results { margin-top: 15px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 14px; border-left: 4px solid #009688; }
    .card-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; color: #80cbc4; }
    .card-compat { font-size: 14px; color: #bbb; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="header">
    <h1>ProTector</h1>
    <span style="font-size: 13px; color: #888;">Ekran qoruyucu uyğunluğu</span>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Model axtarışı (məs: 11, A20, iPhone...)" autocomplete="off">
    
    <!-- Brend Filtrləri -->
    <div class="filters" id="brandFilters">
      <button class="filter-btn" data-brand="iPhone">Apple</button>
      <button class="filter-btn" data-brand="Samsung">Samsung</button>
      <button class="filter-btn" data-brand="Xiaomi">Xiaomi</button>
      <button class="filter-btn" data-brand="Redmi">Redmi</button>
      <button class="filter-btn" data-brand="Poco">Poco</button>
      <button class="filter-btn" data-brand="Honor">Honor</button>
    </div>
  </div>

  <div class="results" id="resultsContainer"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    let data = [];
    let currentBrand = '';
    const searchInput = document.getElementById('searchInput');
    const container = document.getElementById('resultsContainer');
    const filterBtns = document.querySelectorAll('.filter-btn');

    // Məlumat bazasını çəkmək
    fetch('./Base.json')
      .then(res => res.ok ? res.json() : Promise.reject("Fayl tapılmadı"))
      .then(jsonData => { data = jsonData; })
      .catch(() => { container.innerHTML = "<div style='color: red; text-align: center;'>Baza xətası!</div>"; });

    // Nəticələri ekrana yazdırmaq
    function render(list) {
      container.innerHTML = "";
      if (list.length === 0) {
        container.innerHTML = "<div style='color: #666; text-align: center;'>Nəticə tapılmadı</div>";
        return;
      }
      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="card-title">${item.main || item.model || 'Model'}</div>
          <div class="card-compat"><strong>Uyğun modellər:</strong> ${Array.isArray(item.compatible) ? item.compatible.join(', ') : item.compatible}</div>
        `;
        container.appendChild(div);
      });
    }

    // Əsas axtarış funksiyası (Həm mətn, həm brend üçün)
    function filterResults() {
      const textVal = searchInput.value.toLowerCase().trim();
      
      // Həm axtarış, həm də brend seçilməyibsə ekranı təmizlə
      if (!textVal && !currentBrand) {
        container.innerHTML = "";
        return;
      }

      let filtered = data;

      // 1. Seçilmiş brendə görə süzgəc
      if (currentBrand) {
        filtered = filtered.filter(item => {
          const mainName = (item.main || item.model || '').toLowerCase();
          return mainName.includes(currentBrand.toLowerCase());
        });
      }

      // 2. Yazılmış mətnə görə süzgəc
      if (textVal) {
        filtered = filtered.filter(item => {
          const mainMatch = (item.main || item.model || '').toLowerCase().includes(textVal);
          const compatList = Array.isArray(item.compatible) ? item.compatible : [item.compatible];
          const compatMatch = compatList.some(c => String(c).toLowerCase().includes(textVal));
          return mainMatch || compatMatch;
        });
      }

      render(filtered);
    }

    // Axtarış qutusuna yazılanda
    searchInput.addEventListener('input', filterResults);

    // Brend düymələrinə kliklənəndə
    filterBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const clickedBrand = e.target.dataset.brand;
        
        if (currentBrand === clickedBrand) {
          // Eyni düyməyə təkrar basıldıqda seçimi ləğv et
          currentBrand = '';
          e.target.classList.remove('active');
        } else {
          // Yeni brend seçildikdə digərlərini söndür, bunu aktivləşdir
          filterBtns.forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentBrand = clickedBrand;
        }
        
        filterResults();
      });
    });
  </script>
</body>
</html>
