<!doctype html>
<html lang="az">
<head>
<!-- Səhifə: /application/download  |  Mətnlər: /texts/download.json  |  Menyu: /texts/common.json -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Proqramı yüklə — ProTechtor™</title>
<meta name="description" content="ProTechtor™ Android proqramının ən son versiyasını rəsmi serverdən yükləyin. Cari versiya, quraşdırma qaydası və təhlükəsizlik məlumatı.">
<meta name="theme-color" content="#0a0a0a">
<link rel="canonical" href="https://protechtor.app/application/download">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ProTechtor™">
<meta property="og:title" content="Proqramı yüklə — ProTechtor™">
<meta property="og:description" content="ProTechtor™ Android proqramının ən son versiyasını rəsmi serverdən yükləyin. Cari versiya, quraşdırma qaydası və təhlükəsizlik məlumatı.">
<meta property="og:url" content="https://protechtor.app/application/download">
<meta property="og:image" content="https://protechtor.app/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js" defer></script>
</head>
<body data-page="download">
<header id="top"></header>
<main>
  <div class="wrap">
    <div class="dl-hero">
      <div>
        <h1 data-t="hero.h"></h1>
        <p class="lead" data-t="hero.p"></p>
        <div class="dl-box">
          <a class="btn" href="/apk/ProTechtor.apk" id="dl-btn"><span>⬇</span> <span data-t="dl.btn"></span></a>
          <div class="meta"><span data-t="dl.ver"></span> <b id="ver">—</b></div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="note" data-t="dl.note"></div>
      </div>
      <div>
        <div class="stage" aria-hidden="true">
          <span class="ph p-book"><img src="/assets/phones/phone-fold-book.svg" alt="" loading="eager" decoding="async"></span>
          <span class="ph p-sq"><img src="/assets/phones/phone-back-square.svg" alt="" loading="eager" decoding="async"></span>
          <span class="ph p-vert"><img src="/assets/phones/phone-back-vertical.svg" alt="" loading="eager" decoding="async"></span>
          <span class="ph p-front"><img src="/assets/phones/phone-front.svg" alt="" loading="eager" decoding="async"></span>
          <span class="ph p-isl"><img src="/assets/phones/phone-back-island.svg" alt="" loading="eager" decoding="async"></span>
          <span class="ph p-flip"><img src="/assets/phones/phone-fold-flip.svg" alt="" loading="eager" decoding="async"></span>
        </div>
        <p class="stage-cap" data-t="cap"></p>
      </div>
    </div>

    <section class="card" id="updates" data-acc="🔄">
      <h2 data-t="up.h"></h2>
      <p id="notes"></p>
      <p data-t="up.p"></p>
    </section>
    <section class="card" id="req" data-acc="📋">
      <h2 data-t="req.h"></h2>
      <ul data-list="req.ul"></ul>
    </section>
    <section class="card" id="safe" data-acc="🛡️">
      <h2 data-t="safe.h"></h2>
      <div data-list="safe.p"></div>
    </section>

    <h2 class="sec-h" data-t="next.h"></h2>
    <div class="tiles" data-links="next.links"></div>
    <script>
    (function () {
      var vj = null;
      function show() {
        var c = document.getElementById("chips");
        c.innerHTML = (PT.t("chips") || []).map(function (x) { return "<span>" + PT.esc(x) + "</span>"; }).join("");
        if (!vj) return;
        var l = PT.lang();
        var n = l === "az" ? vj.notes : (vj["notes_" + l] || vj.notes);
        document.getElementById("ver").textContent = vj.versionName || "—";
        document.getElementById("notes").textContent = n || "";
        if (vj.url) document.getElementById("dl-btn").href = vj.url.replace(/^https:\/\/protechtor\.app/, "");
      }
      fetch("/apk/version.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) { vj = j; if (window.PT && PT.t("chips")) show(); }).catch(function () {});
      document.addEventListener("pt:rendered", show);
    })();
    </script>
  </div>
</main>
<footer id="foot"></footer>
</body>
</html>
