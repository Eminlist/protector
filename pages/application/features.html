<!doctype html>
<html lang="az">
<head>
<!-- Səhifə: /application/features  |  Mətnlər: /texts/features.json  |  Menyu: /texts/common.json -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Proqramın üstünlükləri — ProTechtor™</title>
<meta name="description" content="ProTechtor™ proqramının əsas imkanları və mağazalar üçün üstünlükləri.">
<meta name="theme-color" content="#0a0a0a">
<link rel="canonical" href="https://protechtor.app/application/features">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ProTechtor™">
<meta property="og:title" content="Proqramın üstünlükləri — ProTechtor™">
<meta property="og:description" content="ProTechtor™ proqramının əsas imkanları və mağazalar üçün üstünlükləri.">
<meta property="og:url" content="https://protechtor.app/application/features">
<meta property="og:image" content="https://protechtor.app/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js" defer></script>
</head>
<body data-page="features">
<header id="top"></header>
<main>
  <div class="wrap">
    <div class="hero">
      <h1 data-t="hero.h"></h1>
      <p data-t="hero.p"></p>
      <div class="btns"><a class="btn" href="/application/download"><span>⬇</span> <span data-t="hero.b1"></span></a></div>
    </div>
    <section class="card"><div class="stats" id="stats"></div></section>
    <h2 class="sec-h" data-t="f.h"></h2>
    <div class="grid" data-cards="f.c" style="margin-top:0"></div>
    <section class="card" id="shops" data-acc="🏪" data-acc-open style="margin-top:24px">
      <h2 data-t="shops.h"></h2>
      <div data-list="shops.p"></div>
    </section>
    <section class="card">
      <h2 data-t="cta.h"></h2>
      <p data-t="cta.p"></p>
      <div class="btns"><a class="btn" href="/application/download"><span>⬇</span> <span data-t="hero.b1"></span></a></div>
    </section>
    <script>
    document.addEventListener("pt:rendered", function () {
      document.getElementById("stats").innerHTML = (PT.t("stats") || []).map(function (x) {
        return "<div><b>" + PT.fmt(x[0]) + "</b><span>" + PT.fmt(x[1]) + "</span></div>";
      }).join("");
    });
    </script>
  </div>
</main>
<footer id="foot"></footer>
</body>
</html>
