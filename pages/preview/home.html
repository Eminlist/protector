<body data-page="home">
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="/icon-192.png" alt="">ProTechtor™</a>
    <nav class="nav" id="nav">
      <a href="/" data-t="nav.home"></a>
      <a href="/application" data-t="nav.app"></a>
      <a href="/contact" data-t="nav.contact"></a>
      <a href="/privacy" data-t="nav.privacy"></a>
    </nav>
    <button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
    <select class="lang" id="lang" aria-label="Language">
      <option value="az">AZ</option><option value="ru">RU</option><option value="tr">TR</option><option value="en">EN</option>
    </select>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="hero">
      <h1 data-t="hero.h"></h1>
      <p data-t="hero.p"></p>
      <div class="btns">
        <a class="btn" href="/application/download"><span>⬇</span> <span data-t="hero.b1"></span></a>
        <a class="btn ghost" href="/application/android" data-t="hero.b2"></a>
      </div>
    </div>

    <section class="card"><div class="stats" id="stats"></div></section>

    <h2 style="margin-top:40px" data-t="f.h"></h2>
    <div class="grid" data-cards="f.c" style="margin-top:12px"></div>

    <section class="card" style="margin-top:40px">
      <h2 data-t="how.h"></h2>
      <ol class="steps" data-list="how.steps"></ol>
    </section>

    <section class="card">
      <h2 data-t="shops.h"></h2>
      <div data-list="shops.p"></div>
    </section>

    <section class="card">
      <h2 data-t="cta.h"></h2>
      <p data-t="cta.p"></p>
      <div class="btns"><a class="btn" href="/application/download"><span>⬇</span> <span data-t="hero.b1"></span></a></div>
    </section>
  </div>
</main>
<script>
document.addEventListener("pt:rendered", function () {
  var s = PT.t("stats") || [];
  document.getElementById("stats").innerHTML = s.map(function (x) {
    return "<div><b>" + PT.fmt(x[0]) + "</b><span>" + PT.fmt(x[1]) + "</span></div>";
  }).join("");
});
</script>
<footer>
  <div class="wrap">
    <span>© <span id="year"></span> ProTechtor™</span>
    <a href="/application" data-t="nav.app"></a>
    <a href="/contact" data-t="nav.contact"></a>
    <a href="/privacy" data-t="nav.privacy"></a>
    <span class="sp" data-t="foot.rights"></span>
  </div>
</footer>
</body>
