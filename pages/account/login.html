<!doctype html>
<html lang="az">
<head>
<!-- Səhifə: /account/login  |  Mətnlər: /texts/login.json  |  Menyu: /texts/common.json -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Giriş — ProTechtor™</title>
<meta name="description" content="ProTechtor™ hesabına giriş qaydası və şifrənin bərpası.">
<meta name="theme-color" content="#0a0a0a">
<link rel="canonical" href="https://protechtor.app/account/login">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ProTechtor™">
<meta property="og:title" content="Giriş — ProTechtor™">
<meta property="og:description" content="ProTechtor™ hesabına giriş qaydası və şifrənin bərpası.">
<meta property="og:url" content="https://protechtor.app/account/login">
<meta property="og:image" content="https://protechtor.app/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-check-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js" defer></script>
<script src="/assets/login.js" defer></script>
</head>
<body data-page="login">
<header id="top"></header>
<main>
  <div class="wrap">
    <div class="hero">
      <h1 data-t="hero.h"></h1>
      <p data-t="hero.p"></p>
      <div class="btns">
        <a class="btn ghost" href="/application/download"><span>⬇</span> <span data-t="btn.dl"></span></a>
      </div>
      <p style="margin-top:14px"><a href="/account/register" data-t="btn.alt"></a></p>
    </div>
    <form class="card rform" id="lg" novalidate autocomplete="on">
      <h2 data-t="form.h"></h2>
      <label><span data-t="form.email"></span><input id="lEmail" type="email" autocomplete="email" inputmode="email" maxlength="120" required></label>
      <label><span data-t="form.pass"></span><input id="lPass" type="password" autocomplete="current-password" maxlength="64" required></label>
      <div id="lMsg" class="rmsg" role="status" aria-live="polite"></div>
      <button class="btn" id="lBtn" type="submit" data-t="form.btn"></button>
      <a href="#" id="lForgot" class="lforgot" data-t="form.forgot"></a>
    </form>
    <div class="card rform" id="lIn" hidden>
      <div class="rmsg ok" data-t="form.ok"></div>
      <p><span data-t="form.as"></span> <b id="lWho"></b></p>
      <button class="btn ghost" id="lOut" type="button" data-t="form.out"></button>
    </div>
    <div data-sections="s" style="margin-top:20px"></div>
  </div>
</main>
<footer id="foot"></footer>
</body>
</html>
