<!doctype html>
<html lang="az">
<head>
<!-- Səhifə: /account/register  |  Mətnlər: /texts/register.json  |  Menyu: /texts/common.json -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qeydiyyat — ProTechtor™</title>
<meta name="description" content="ProTechtor™ hesabının yaradılması: tələb olunan məlumatlar və qeydiyyat qaydası.">
<meta name="theme-color" content="#0a0a0a">
<link rel="canonical" href="https://protechtor.app/account/register">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ProTechtor™">
<meta property="og:title" content="Qeydiyyat — ProTechtor™">
<meta property="og:description" content="ProTechtor™ hesabının yaradılması: tələb olunan məlumatlar və qeydiyyat qaydası.">
<meta property="og:url" content="https://protechtor.app/account/register">
<meta property="og:image" content="https://protechtor.app/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-check-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js" defer></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script src="/assets/register.js" defer></script>
</head>
<body data-page="register">
<header id="top"></header>
<main>
  <div class="wrap">
    <div class="hero">
      <h1 data-t="hero.h"></h1>
      <p data-t="hero.p"></p>
      <div class="btns">
        <a class="btn ghost" href="/application/download"><span>⬇</span> <span data-t="btn.dl"></span></a>
      </div>
      <p style="margin-top:14px"><a href="/account/login" data-t="btn.alt"></a></p>
    </div>
    <form class="card rform" id="reg" novalidate autocomplete="on">
      <h2 data-t="form.h"></h2>
      <label><span data-t="form.name"></span><input id="rName" type="text" autocomplete="name" maxlength="60" required></label>
      <label><span data-t="form.email"></span><input id="rEmail" type="email" autocomplete="email" inputmode="email" maxlength="120" required></label>
      <label><span data-t="form.pass"></span><input id="rPass" type="password" autocomplete="new-password" maxlength="64" required><small data-t="form.passHint"></small></label>
      <label><span data-t="form.phone"></span><div class="rphone"><b>+994</b><input id="rPhone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="50 123 45 67" maxlength="12" required></div></label>
      <label><span data-t="form.store"></span><input id="rStore" type="text" autocomplete="organization" maxlength="80"></label>
      <label><span data-t="form.address"></span><input id="rAddr" type="text" autocomplete="street-address" maxlength="120"></label>
      <div id="rTs" class="rts"></div>
      <div id="rMsg" class="rmsg" role="status" aria-live="polite"></div>
      <button class="btn" id="rBtn" type="submit" data-t="form.btn"></button>
    </form>
    <div data-sections="s" style="margin-top:20px"></div>
  </div>
</main>
<footer id="foot"></footer>
</body>
</html>
