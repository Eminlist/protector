<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ProTechtor™</title>
<meta name="description" content="">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js" defer></script>
</head>
<body data-page="contact">
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="/icon-192.png" alt="">ProTechtor™</a>
    <nav class="nav" id="nav">
      <a href="/" data-t="nav.home"></a>
      <a href="/application" data-t="nav.app"></a>
      <a href="/contact" data-t="nav.contact"></a>
      <a href="/privacy" data-t="nav.privacy"></a>
    </nav>
    <button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
    <select class="lang" id="lang" aria-label="Language">
      <option value="az">AZ</option><option value="ru">RU</option><option value="tr">TR</option><option value="en">EN</option>
    </select>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="hero">
      <h1 data-t="hero.h"></h1>
      <p data-t="hero.p"></p>
    </div>
    <div class="grid">
      <div class="card contact">
        <div class="ic">✈️</div>
        <div><h3 data-t="tg.h"></h3><a href="https://t.me/protechtor_app" target="_blank" rel="noopener">@protechtor_app</a></div>
      </div>
      <div class="card contact">
        <div class="ic">✉️</div>
        <div><h3 data-t="mail.h"></h3><a href="mailto:app.protechtor@gmail.com">app.protechtor@gmail.com</a></div>
      </div>
      <div class="card contact">
        <div class="ic">💬</div>
        <div><h3 data-t="chat.h"></h3><span class="meta" data-t="chat.p"></span></div>
      </div>
    </div>
    <section class="card">
      <h2 data-t="info.h"></h2>
      <div data-list="info.p"></div>
    </section>
  </div>
</main>
<footer>
  <div class="wrap">
    <span>© <span id="year"></span> ProTechtor™</span>
    <a href="/application" data-t="nav.app"></a>
    <a href="/contact" data-t="nav.contact"></a>
    <a href="/privacy" data-t="nav.privacy"></a>
    <span class="sp" data-t="foot.rights"></span>
  </div>
</footer>
</body>
</html>
