name: D1 backup (protector-db)

on:
  schedule:
    - cron: "0 6 * * 1"   # hər bazar ertəsi 10:00 Bakı (həftəlik)
    - cron: "5 6 1 * *"   # hər ayın 1-i 10:05 Bakı (aylıq)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type and file name
        run: |
          if [ "${{ github.event.schedule }}" = "5 6 1 * *" ]; then KIND=ayliq; DAYS=400; else KIND=heftelik; DAYS=90; fi
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && KIND=elle && DAYS=30
          echo "KIND=$KIND" >> $GITHUB_ENV
          echo "DAYS=$DAYS" >> $GITHUB_ENV
          echo "FILE=protector-db_${KIND}_$(TZ=Asia/Baku date +%Y-%m-%d_%H%M).sql" >> $GITHUB_ENV
      - name: Export D1
        run: |
          npx -y wrangler@4 d1 export protector-db --remote --output "$FILE"
          gzip -9 "$FILE"
          ls -lh "$FILE.gz"
      - name: Keep as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}.gz
          retention-days: ${{ env.DAYS }}
      - name: Send to Telegram
        if: ${{ env.TG_TOKEN != '' && env.TG_CHAT != '' }}
        run: |
          SIZE=$(stat -c %s "$FILE.gz")
          if [ "$SIZE" -lt 49000000 ]; then
            curl -fsS "https://api.telegram.org/bot$TG_TOKEN/sendDocument" -F "chat_id=$TG_CHAT" \
              -F "document=@$FILE.gz" -F "caption=💾 D1 backup ($KIND): $(numfmt --to=iec $SIZE)" > /dev/null && echo "Telegram OK"
          else
            curl -fsS "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d "chat_id=$TG_CHAT" \
              --data-urlencode "text=💾 D1 backup ($KIND) hazırdır, amma $(numfmt --to=iec $SIZE) — Telegram üçün böyükdür. GitHub Actions → D1 backup bölməsindən yüklə." > /dev/null
          fi
      - name: Alert on failure
        if: ${{ failure() && env.TG_TOKEN != '' }}
        run: |
          curl -fsS "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d "chat_id=$TG_CHAT" \
            --data-urlencode "text=⚠️ D1 backup ($KIND) alınmadı. GitHub Actions-a bax." > /dev/null || true
