name: Deploy protector-data Worker

on:
  push:
    branches: [main]
    paths: ["data-worker/**", ".github/workflows/data-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN və CLOUDFLARE_ACCOUNT_ID secrets əlavə edilməyib"; exit 1; fi
      - name: Find D1 id and write wrangler.toml
        working-directory: data-worker
        run: |
          npx -y wrangler@4 d1 list --json > d1.json
          ID=$(node -e "const a=JSON.parse(require('fs').readFileSync('d1.json','utf8'));const d=a.find(x=>x.name==='protector-db');if(!d){console.error('protector-db tapılmadı');process.exit(1)}console.log(d.uuid||d.id)")
          sed "s/__D1_ID__/$ID/" wrangler.template.toml > wrangler.toml
          rm d1.json
      - name: Deploy
        working-directory: data-worker
        run: npx -y wrangler@4 deploy -c wrangler.toml
      - name: Sync Telegram secrets (protector-data)
        if: ${{ env.TG_TOKEN != '' && env.TG_CHAT != '' }}
        working-directory: data-worker
        run: |
          printf '%s' "$TG_TOKEN" | npx -y wrangler@4 secret put TG_TOKEN --name protector-data
          printf '%s' "$TG_CHAT" | npx -y wrangler@4 secret put TG_CHAT --name protector-data
      - name: Telegram test (only on manual run)
        if: ${{ github.event_name == 'workflow_dispatch' && env.TG_TOKEN != '' && env.TG_CHAT != '' }}
        run: |
          curl -fsS "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d "chat_id=$TG_CHAT" --data-urlencode "text=✅ protector-data: xəbərdarlıq sistemi işləyir" > /dev/null && echo "Telegram OK"
