name: Deploy protector-data Worker

on:
  push:
    branches: [main]
    paths: ["data-worker/**", ".github/workflows/data-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN və CLOUDFLARE_ACCOUNT_ID secrets əlavə edilməyib"; exit 1; fi
      - name: Find D1 id and write wrangler.toml
        working-directory: data-worker
        run: |
          npx -y wrangler@4 d1 list --json > d1.json
          ID=$(node -e "const a=JSON.parse(require('fs').readFileSync('d1.json','utf8'));const d=a.find(x=>x.name==='protector-db');if(!d){console.error('protector-db tapılmadı');process.exit(1)}console.log(d.uuid||d.id)")
          sed "s/__D1_ID__/$ID/" wrangler.template.toml > wrangler.toml
          rm d1.json
      - name: Deploy
        working-directory: data-worker
        run: npx -y wrangler@4 deploy
