name: Rules diag (müvəqqəti)
on:
  push:
    branches: [main]
    paths: [.github/workflows/rules-diag.yml]
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      P: protechtor-99407
      FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
    steps:
      - uses: actions/checkout@v4
      - name: Diag (yalnız oxuma + dərc olunmayan test ruleset)
        run: |
          printf '%s' "$FIREBASE_SA" > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json --quiet
          T=$(gcloud auth print-access-token); echo "::add-mask::$T"; rm -f /tmp/sa.json
          A="Authorization: Bearer $T"; B=https://firebaserules.googleapis.com/v1/projects/$P
          echo "== releases"; curl -sS -H "$A" "$B/releases?pageSize=20"; echo
          echo "== rulesets list"; curl -sS -o rl.json -w 'HTTP %{http_code}\n' -H "$A" "$B/rulesets?pageSize=5"; head -c 600 rl.json; echo
          R=$(curl -sS -H "$A" "$B/releases/cloud.firestore" | jq -r .rulesetName); echo "live: $R"
          echo "== live ruleset get"; curl -sS -o live.json -w 'HTTP %{http_code}\n' -H "$A" "https://firebaserules.googleapis.com/v1/$R"
          jq -r '.source.files[0].content' live.json > live.rules 2>/dev/null; wc -l live.rules; grep -n "duration.value\|holWin" live.rules | head
          echo "== create trivial ruleset"
          jq -n '{source:{files:[{name:"t.rules",content:"rules_version = '"'"'2'"'"';\nservice cloud.firestore { match /databases/{d}/documents { match /{x=**} { allow read, write: if false; } } }"}]}}' > t.json
          curl -sS -w '\nHTTP %{http_code}\n' -X POST -H "$A" -H "Content-Type: application/json" "$B/rulesets" -d @t.json
          echo "== create ruleset from LIVE source"
          jq -n --rawfile c live.rules '{source:{files:[{name:"firestore.rules",content:$c}]}}' > l.json
          curl -sS -w '\nHTTP %{http_code}\n' -X POST -H "$A" -H "Content-Type: application/json" "$B/rulesets" -d @l.json | tail -c 400
          echo "== test NEW source (:test)"
          jq -n --rawfile c firestore.rules '{source:{files:[{name:"firestore.rules",content:$c}]}}' > n.json
          curl -sS -w '\nHTTP %{http_code}\n' -X POST -H "$A" -H "Content-Type: application/json" "https://firebaserules.googleapis.com/v1/projects/$P:test" -d @n.json | tail -c 1500
