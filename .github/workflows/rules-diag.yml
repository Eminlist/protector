name: Rules diag (müvəqqəti)
on:
  push:
    branches: [main]
    paths: [.github/workflows/rules-diag.yml]
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      P: protechtor-99407
      FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
    steps:
      - uses: actions/checkout@v4
      - name: Diag (yalnız oxuma + dərc olunmayan test ruleset)
        run: |
          printf '%s' "$FIREBASE_SA" > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json --quiet
          T=$(gcloud auth print-access-token); echo "::add-mask::$T"; rm -f /tmp/sa.json
          A="Authorization: Bearer $T"; B=https://firebaserules.googleapis.com/v1/projects/$P
          for f in tools/rdiag/*.rules; do
            jq -n --rawfile c "$f" '{source:{files:[{name:"firestore.rules",content:$c}]}}' > v.json
            code=$(curl -sS -o vr.json -w '%{http_code}' -X POST -H "$A" -H "Content-Type: application/json" "$B/rulesets" -d @v.json)
            echo "RESULT $(basename $f) HTTP $code $(jq -c '.error.message // empty' vr.json | head -c 300)"
          done
