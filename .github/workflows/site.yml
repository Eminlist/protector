name: Deploy site (protechtor.app)

on:
  push:
    branches: [main]
    paths-ignore: ["chat-worker/**", ".github/workflows/chat-worker.yml", "README.md", "SECURITY.md"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect site files
        run: |
          mkdir dist
          cp index.html sw.js manifest.json *.png *.ico dist/
      - name: Deploy
        run: npx -y wrangler@4 deploy
