name: Deploy site (protechtor.app)

on:
  push:
    branches: [main]
    paths-ignore: ["chat-worker/**", ".github/workflows/chat-worker.yml", "data-worker/**", ".github/workflows/data-worker.yml", "README.md", "SECURITY.md"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect site files
        run: |
          mkdir -p dist/application/eminapp
          # Proqram (veb tətbiq): protechtor.app/application/eminapp/
          cp index.html sw.js manifest.json *.png *.ico dist/application/eminapp/
          # Sayt səhifələri (ana səhifə = pages/index.html) və ümumi ikonlar
          cp *.png *.ico dist/
          cp -r pages/. dist/
          rm -f dist/README.md
          test -f dist/index.html || { echo "::error::pages/index.html (ana səhifə) yoxdur"; exit 1; }
      - name: Build single-file help for the app
        run: node tools/build-help-app.mjs dist/help/app.html
      - name: Deploy
        run: npx -y wrangler@4 deploy
