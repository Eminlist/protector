<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ProTechtor™ — tezliklə</title>
<meta name="description" content="ProTechtor™ yenilənir. Tezliklə xidmətinizdə — super bir şey hazırlanır.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080d">
<link rel="icon" href="/icon-192.png" type="image/png">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#07080d;color:#eef1f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;overflow:hidden;text-align:center;padding:24px}
.glow{position:fixed;inset:-20%;background:
 radial-gradient(40% 40% at 25% 30%,rgba(80,140,255,.30),transparent 70%),
 radial-gradient(35% 35% at 75% 70%,rgba(160,90,255,.28),transparent 70%),
 radial-gradient(30% 30% at 60% 20%,rgba(0,220,200,.18),transparent 70%);
 filter:blur(30px);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,-4%,0) scale(1.08)}}
main{position:relative;max-width:560px}
.logo{width:92px;height:92px;border-radius:24px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 20px 60px rgba(90,140,255,.35);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
h1{margin-top:28px;font-size:clamp(28px,6vw,44px);letter-spacing:-.02em;line-height:1.1}
h1 span{background:linear-gradient(90deg,#6aa8ff,#b57bff,#35e0cf);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin-top:16px;color:#aab2c5;font-size:clamp(15px,3.6vw,18px);line-height:1.55}
.pill{display:inline-flex;gap:10px;align-items:center;margin-top:30px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);font-size:14px;color:#cfd6e6}
.dot{width:9px;height:9px;border-radius:50%;background:#35e0cf;box-shadow:0 0 0 0 rgba(53,224,207,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(53,224,207,0)}100%{box-shadow:0 0 0 0 rgba(53,224,207,0)}}
a{color:#8db8ff;text-decoration:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <img class="logo" src="/icon-192.png" alt="ProTechtor™">
  <h1 id="t">Sayt <span>təmirdədir</span></h1>
  <p id="d">Tezliklə xidmətinizdə! Sizin üçün super bir şey hazırlayırıq — gözləməyə dəyəcək.</p>
  <div class="pill"><i class="dot"></i><span id="s">Hazırlıq gedir</span></div>
  <p style="margin-top:26px;font-size:14px"><a href="https://protechtor.app">protechtor.app</a></p>
</main>
<script>
var L={
az:["Sayt <span>təmirdədir</span>","Tezliklə xidmətinizdə! Sizin üçün super bir şey hazırlayırıq — gözləməyə dəyəcək.","Hazırlıq gedir"],
ru:["Сайт на <span>обслуживании</span>","Скоро будем к вашим услугам! Готовим для вас кое-что супер — ожидание того стоит.","Идёт подготовка"],
tr:["Site <span>bakımda</span>","Çok yakında hizmetinizde! Sizin için süper bir şey hazırlıyoruz — beklemeye değecek.","Hazırlıklar sürüyor"],
en:["Site <span>under maintenance</span>","Coming soon! We're building something super for you — it'll be worth the wait.","Getting ready"]};
var l=(navigator.language||"az").slice(0,2).toLowerCase();var x=L[l]||L.az;
document.documentElement.lang=L[l]?l:"az";
document.getElementById("t").innerHTML=x[0];document.getElementById("d").textContent=x[1];document.getElementById("s").textContent=x[2];
</script>
</body>
</html>
